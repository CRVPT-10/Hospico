# Zoho Data Store settings (credentials in application-zoho.properties)
zoho:
  cloudscale:
    collection: users

# Groq API key — read from env var on deployed server, overridden by profile properties locally
groq:
  api:
    key: ${GROQ_API_KEY:}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:739900909331-8c366u1mjq8s99s9mdjr01eqvvjg67oc.apps.googleusercontent.com}
    client-ids: ${GOOGLE_CLIENT_IDS:}
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

server:
  port: ${X_ZOHO_CATALYST_LISTEN_PORT:${PORT:8080}}
  address: 0.0.0.0

spring:
  profiles:
    active: zoho
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  main:
    lazy-initialization: true
    banner-mode: off
    log-startup-info: false
    allow-bean-definition-overriding: true
    allow-circular-references: true
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: false
  jmx:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: true

application:
  name: hospital-booking-backend

app:
  mail:
    from: ${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
  signup:
    otp:
      allow-console-fallback: ${APP_SIGNUP_OTP_ALLOW_CONSOLE_FALLBACK:false}
